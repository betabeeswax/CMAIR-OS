name: Cardputer ADV firmware build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "firmware/cardputer-adv/**"
      - ".github/workflows/cardputer-firmware.yml"
  pull_request:
    branches: [main]
    paths:
      - "firmware/cardputer-adv/**"
      - ".github/workflows/cardputer-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3
          target: esp32s3
          path: firmware/cardputer-adv
          command: idf.py build && idf.py merge-bin -o cmair-os-cardputer-adv.bin
      - name: Upload firmware build
        uses: actions/upload-artifact@v4
        with:
          name: cmair-os-cardputer-adv
          path: firmware/cardputer-adv/build/cmair-os-cardputer-adv.bin
          if-no-files-found: error
      - name: Publish development firmware release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha
          target_commitish: main
          name: CMAIR-OS v0.1.0-alpha (development firmware)
          prerelease: true
          files: firmware/cardputer-adv/build/cmair-os-cardputer-adv.bin
          generate_release_notes: true
      - name: Publish versioned firmware release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/cardputer-adv/build/cmair-os-cardputer-adv.bin
          generate_release_notes: true
